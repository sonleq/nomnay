<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chunom Dictionary - Tra cứu Chữ Nôm</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f8f9fc;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
      padding: 30px 20px 20px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 16px;
      margin-bottom: 30px;
      color: white;
      box-shadow: 0 10px 40px rgba(26, 26, 46, 0.3);
    }

    .header h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .header h1 span {
      color: #f7d44a;
    }

    .header p {
      font-weight: 300;
      opacity: 0.8;
      font-size: 1.1rem;
    }

    .header .badge {
      display: inline-block;
      background: rgba(247, 212, 74, 0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-top: 10px;
      border: 1px solid rgba(247, 212, 74, 0.3);
    }

    /* ===== STATS BAR ===== */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 15px 20px;
      background: white;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      flex-wrap: wrap;
    }

    .stats-bar .stat-item {
      text-align: center;
    }

    .stats-bar .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a1a2e;
      display: block;
    }

    .stats-bar .stat-label {
      font-size: 0.8rem;
      color: #6b7280;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ===== SEARCH SECTION ===== */
    .search-section {
      background: white;
      border-radius: 16px;
      padding: 25px 30px;
      margin-bottom: 30px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid #e5e7eb;
    }

    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-row .search-wrapper {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-row input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      font-size: 1.05rem;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      background: #fafbfc;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .search-row input:focus {
      outline: none;
      border-color: #4f46e5;
      background: white;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .search-row input::placeholder {
      color: #9ca3af;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: #9ca3af;
    }

    .search-row .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-row .filter-btn {
      padding: 10px 18px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
      color: #6b7280;
      font-family: 'Inter', sans-serif;
    }

    .search-row .filter-btn:hover {
      border-color: #4f46e5;
      color: #4f46e5;
    }

    .search-row .filter-btn.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }

    /* ===== RESULTS ===== */
    .results-section {
      background: white;
      border-radius: 16px;
      padding: 20px 25px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid #e5e7eb;
      min-height: 200px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f3f4f6;
      flex-wrap: wrap;
      gap: 10px;
    }

    .results-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a1a2e;
    }

    .results-header .result-count {
      font-size: 0.85rem;
      color: #6b7280;
      background: #f3f4f6;
      padding: 4px 14px;
      border-radius: 20px;
    }

    /* ===== GRID VIEW ===== */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .grid-view .entry-card {
      background: #fafbfc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px 18px;
      transition: all 0.2s;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid-view .entry-card:hover {
      border-color: #4f46e5;
      background: #f8f7ff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
    }

    .grid-view .entry-card .quoc-ngu {
      font-size: 0.95rem;
      font-weight: 500;
      color: #1a1a2e;
    }

    .grid-view .entry-card .chunom {
      font-family: 'Noto Serif TC', 'Han Nom', 'Nom Na Tong', serif;
      font-size: 1.5rem;
      color: #4f46e5;
      font-weight: 600;
      text-align: right;
    }

    .grid-view .entry-card .chunom-small {
      font-size: 1.1rem;
      color: #6b7280;
    }

    /* ===== LIST VIEW ===== */
    .list-view .entry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.15s;
      cursor: pointer;
      gap: 16px;
      flex-wrap: wrap;
    }

    .list-view .entry-row:hover {
      background: #f8f7ff;
    }

    .list-view .entry-row .quoc-ngu {
      font-size: 0.95rem;
      font-weight: 500;
      color: #1a1a2e;
      flex: 1;
      min-width: 150px;
    }

    .list-view .entry-row .chunom {
      font-family: 'Noto Serif TC', 'Han Nom', 'Nom Na Tong', serif;
      font-size: 1.4rem;
      color: #4f46e5;
      text-align: right;
    }

    /* ===== SELECTED AREA ===== */
    .selected-section {
      background: white;
      border-radius: 16px;
      padding: 20px 25px;
      margin-top: 25px;
      border: 2px dashed #d1d5db;
      transition: all 0.3s;
      min-height: 80px;
    }

    .selected-section.has-items {
      border-color: #4f46e5;
      border-style: solid;
      background: #f8f7ff;
    }

    .selected-section .selected-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .selected-section .selected-characters {
      font-family: 'Noto Serif TC', 'Han Nom', 'Nom Na Tong', serif;
      font-size: 2.5rem;
      line-height: 1.6;
      min-height: 50px;
      padding: 8px;
      word-wrap: break-word;
    }

    .selected-section .selected-characters:empty::before {
      content: "Click on any Chunom character to add it here";
      color: #9ca3af;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
    }

    .selected-section .clear-btn {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      background: #ef4444;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .selected-section .clear-btn:hover {
      background: #dc2626;
    }

    /* ===== PAGINATION ===== */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 20px 0 10px;
      flex-wrap: wrap;
    }

    .pagination button {
      padding: 8px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      color: #4b5563;
    }

    .pagination button:hover:not(:disabled) {
      border-color: #4f46e5;
      color: #4f46e5;
    }

    .pagination button.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== LOADING ===== */
    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .loading .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f4f6;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }

      .search-row .search-wrapper {
        min-width: 100%;
      }

      .search-row .filter-buttons {
        width: 100%;
        justify-content: center;
      }

      .grid-view {
        grid-template-columns: 1fr;
      }

      .stats-bar {
        gap: 20px;
      }

      .stats-bar .stat-number {
        font-size: 1.4rem;
      }

      .list-view .entry-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .list-view .entry-row .chunom {
        text-align: left;
        font-size: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 1.4rem;
      }

      .search-section {
        padding: 15px;
      }

      .results-section {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <h1>📜 <span>Chunom</span> Dictionary</h1>
    <p>Tra cứu Chữ Nôm — Hán Nôm</p>
    <div class="badge">✨ Click any character to select</div>
  </div>

  <!-- STATS -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      <span class="stat-number" id="totalEntries">0</span>
      <span class="stat-label">Entries</span>
    </div>
    <div class="stat-item">
      <span class="stat-number" id="totalCharacters">0</span>
      <span class="stat-label">Characters</span>
    </div>
    <div class="stat-item">
      <span class="stat-number" id="selectedCount">0</span>
      <span class="stat-label">Selected</span>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-section">
    <div class="search-row">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search Quốc Ngữ (e.g., 'ai', 'truyện', 'hoa')..."
          autofocus
        >
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-view="grid">📱 Grid</button>
        <button class="filter-btn" data-view="list">📋 List</button>
        <button class="filter-btn" data-view="all">📚 All</button>
      </div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="results-section">
    <div class="results-header">
      <h2>📖 Results</h2>
      <span class="result-count" id="resultCount">0 entries</span>
    </div>
    <div id="resultsContainer">
      <div class="loading">
        <div class="spinner"></div>
        <p style="margin-top:16px;">Loading dictionary...</p>
      </div>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- SELECTED -->
  <div class="selected-section" id="selectedSection">
    <div class="selected-label">📌 Selected Characters</div>
    <div class="selected-characters" id="selectedDisplay"></div>
    <button class="clear-btn" id="clearSelected">🗑️ Clear All</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
